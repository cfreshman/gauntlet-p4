<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="AI-enhanced Pomodoro timer for focused productivity" />
		<meta name="theme-color" content="#111111" />
		
		<title>Gomodoro</title>
		
		<!-- Favicons -->
		<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/icons/appletouch.png" />
		
		<!-- PWA -->
		<link rel="manifest" href="/site.webmanifest" />
		
		<!-- Hide icons while loading -->
		<style>
			.material-icons-round {
				display: none;
			}
			.fonts-loaded .material-icons-round {
				display: inline-block;
			}
		</style>
		
		<!-- Fonts -->
		<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" onload="document.documentElement.classList.add('fonts-loaded')">
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
